name: Amazon job monitor

on:
  workflow_dispatch:
    inputs:
      initialize_only:
        description: Save current jobs without alerts
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: amazon-job-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check Amazon jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALEX_CHAT_ID: ${{ secrets.ALEX_CHAT_ID }}
          INITIALIZE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_only || 'false' }}
        run: python monitor.py

      - name: Save state
        run: |
          if git diff --quiet -- data/seen_jobs.json; then exit 0; fi
          git config user.name "amazon-job-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_jobs.json
          git commit -m "Update seen jobs"
          git push
