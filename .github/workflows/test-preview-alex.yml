name: Preview Amazon alert to Alex

on:
  push:
    paths:
      - ".github/workflows/test-preview-alex.yml"

jobs:
  preview:
    if: github.event.head_commit.message == 'Send alert preview to Alex'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send preview to Alex
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALEX_CHAT_ID: ${{ secrets.ALEX_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          text = (
              "New Amazon job for Mom\n\n"
              "Area Manager, Early Career (2027) – Canada\n"
              "Location: Calgary, AB, CAN\n"
              "Matched: area manager\n"
              "Source: amazon_jobs\n\n"
              "https://www.amazon.jobs/en/jobs/10485154/area-manager-early-career-2027-canada"
          )
          payload = json.dumps({"chat_id": os.environ["ALEX_CHAT_ID"], "text": text}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print(r.status)
          PY
